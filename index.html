<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dice Roller</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: #1a1a24;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-yellow: #ffeb3b;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            background-color: var(--panel-bg);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(255, 0, 255, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        .stars-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            margin-bottom: 30px;
            background: rgba(255, 235, 59, 0.1);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 235, 59, 0.3);
        }

        /* Dice Styles */
        .dice-area {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            perspective: 1000px; /* For 3D animation effect */
        }

        .die {
            width: 90px;
            height: 90px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 0 20px rgba(255, 255, 255, 0.4);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 12px;
            gap: 6px;
            transform-style: preserve-3d;
        }

        .dot {
            background-color: #222;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .dot.show {
            opacity: 1;
        }

        /* Roll Animation */
        @keyframes roll-dice {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
            25% { transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg) scale(1.1); }
            50% { transform: rotateX(360deg) rotateY(180deg) rotateZ(90deg) scale(1.2); }
            75% { transform: rotateX(540deg) rotateY(270deg) rotateZ(135deg) scale(1.1); }
            100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg) scale(1); }
        }

        .rolling {
            animation: roll-dice 1s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        /* Text Area */
        .status-message {
            min-height: 40px;
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jackpot {
            color: var(--neon-yellow);
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px #ff9800;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Buttons */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background: transparent;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
        }

        .btn-roll {
            color: var(--text-color);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .btn-roll:hover:not(:disabled) {
            background-color: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        .btn-roll:disabled {
            border-color: #555;
            color: #555;
            box-shadow: none;
            text-shadow: none;
            cursor: not-allowed;
        }

        .btn-reset {
            color: var(--text-color);
            border: 2px solid var(--neon-pink);
            font-size: 1rem;
            padding: 10px 15px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3), inset 0 0 10px rgba(255, 0, 255, 0.2);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .btn-reset:hover {
            background-color: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 25px var(--neon-pink);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h2 {
            color: var(--neon-pink);
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .modal p {
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .modal button {
            background: var(--neon-pink);
            color: #fff;
            border: none;
            box-shadow: 0 0 15px var(--neon-pink);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>Neon Dice</h1>
            <div class="stars-display">Balance: <span id="star-count">20</span> ⭐</div>
        </header>

        <div class="dice-area">
            <div class="die" id="die1">
                <!-- Dots generated via JS -->
            </div>
            <div class="die" id="die2">
                <!-- Dots generated via JS -->
            </div>
        </div>

        <div class="status-message" id="status-message">
            Ready to test your luck?
        </div>

        <div class="controls">
            <button id="roll-btn" class="btn-roll">Roll Dice (Cost: 1 ⭐)</button>
            <button id="reset-btn" class="btn-reset">Reset / Add 20 Stars</button>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="modal-overlay" id="alert-modal">
        <div class="modal">
            <h2>Out of Stars!</h2>
            <p>You don't have enough stars to play. Please add more to continue rolling.</p>
            <button id="close-modal-btn">Close</button>
        </div>
    </div>

    <script>
        // Game State Variables
        let stars = 20;
        let rollCount = 0;
        const COST_PER_ROLL = 1;
        const JACKPOT_INTERVAL = 15;
        const ANIMATION_DURATION = 1000; // 1 second

        // DOM Elements
        const starCountEl = document.getElementById('star-count');
        const die1El = document.getElementById('die1');
        const die2El = document.getElementById('die2');
        const statusMessageEl = document.getElementById('status-message');
        const rollBtn = document.getElementById('roll-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modalOverlay = document.getElementById('alert-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Dice Dot Patterns (0-8 indices for a 3x3 grid)
        const dotPatterns = {
            1: [4],
            2: [0, 8],
            3: [0, 4, 8],
            4: [0, 2, 6, 8],
            5: [0, 2, 4, 6, 8],
            6: [0, 2, 3, 5, 6, 8]
        };

        // Initialize Game
        function initGame() {
            // Load state from local storage if exists
            const savedStars = localStorage.getItem('diceGameStars');
            const savedRollCount = localStorage.getItem('diceGameRollCount');
            
            if (savedStars !== null) stars = parseInt(savedStars, 10);
            if (savedRollCount !== null) rollCount = parseInt(savedRollCount, 10);

            // Generate initial empty dots inside dice
            createDiceGrid(die1El);
            createDiceGrid(die2El);
            
            // Set initial visuals
            updateUI();
            renderDie(die1El, 6);
            renderDie(die2El, 6);
        }

        // Create the 9 grid items for a die
        function createDiceGrid(dieElement) {
            dieElement.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                dieElement.appendChild(dot);
            }
        }

        // Render specific value on a die
        function renderDie(dieElement, value) {
            const dots = dieElement.querySelectorAll('.dot');
            // Hide all dots
            dots.forEach(dot => dot.classList.remove('show'));
            // Show necessary dots based on pattern
            dotPatterns[value].forEach(index => {
                dots[index].classList.add('show');
            });
        }

        // Update Stars and Storage
        function updateUI() {
            starCountEl.textContent = stars;
            localStorage.setItem('diceGameStars', stars);
            localStorage.setItem('diceGameRollCount', rollCount);
        }

        // Generate Random Dice Value (1 to 6)
        function getRandomDieValue() {
            return Math.floor(Math.random() * 6) + 1;
        }

        // Core Roll Logic
        function performRoll() {
            // Validation Check
            if (stars < COST_PER_ROLL) {
                modalOverlay.classList.add('active');
                return;
            }

            // Deduct Star & Increment Roll Count *before* animation
            stars -= COST_PER_ROLL;
            rollCount++;
            updateUI();

            // Disable Button & Set Rolling State
            rollBtn.disabled = true;
            statusMessageEl.textContent = "Rolling...";
            statusMessageEl.className = "status-message";
            
            die1El.classList.add('rolling');
            die2El.classList.add('rolling');

            // Calculate Results
            let val1, val2;
            let isJackpot = (rollCount % JACKPOT_INTERVAL === 0);

            if (isJackpot) {
                // Rigged Logic: Every 15th roll lands on double 6
                val1 = 6;
                val2 = 6;
            } else {
                // Normal Logic
                val1 = getRandomDieValue();
                val2 = getRandomDieValue();
            }

            // Handle Animation Completion
            setTimeout(() => {
                // Remove Animation
                die1El.classList.remove('rolling');
                die2El.classList.remove('rolling');

                // Render Results
                renderDie(die1El, val1);
                renderDie(die2El, val2);

                const total = val1 + val2;

                // Update Status Message
                if (isJackpot) {
                    statusMessageEl.textContent = `JACKPOT! You rolled a ${total}!`;
                    statusMessageEl.classList.add('jackpot');
                } else {
                    statusMessageEl.textContent = `You rolled a ${total}!`;
                }

                // Re-enable Button
                rollBtn.disabled = false;
            }, ANIMATION_DURATION);
        }

        // Event Listeners
        rollBtn.addEventListener('click', performRoll);

        resetBtn.addEventListener('click', () => {
            stars += 20;
            updateUI();
            statusMessageEl.className = "status-message";
            statusMessageEl.textContent = "Added 20 Stars! Ready to roll.";
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Initialize on Load
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
